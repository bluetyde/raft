name: premerge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VR_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Versions
        run: python3 --version && node --version && npm --version
      - name: Pre-merge checks
        run: python3 scripts/premerge.py

  e2e:
    # Browser end-to-end check of the runtime worker (web/src/app/e2e/), on the production build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npx playwright test -c src/app/e2e/playwright.config.ts
